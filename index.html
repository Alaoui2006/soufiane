<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bijouterie Soufiane</title>
<style>
/* ===== COULEURS: بدل غير hna ===== */
:root {
  --bg: #eceef1;
  --card: #ffffff;
  --text: #1c1f24;
  --muted: #6b7280;
  --silver: #aeb4bd;
  --silver-dark: #5d646e;
  --line: #d6d9de;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1114; --card: #181b20; --text: #f1f2f4; --muted: #9aa1ab;
    --silver: #c9ced6; --silver-dark: #8d949e; --line: #2a2e35; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1114; --card: #181b20; --text: #f1f2f4; --muted: #9aa1ab;
  --silver: #c9ced6; --silver-dark: #8d949e; --line: #2a2e35; color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: "Cormorant Garamond", Georgia, serif;
  display: flex; justify-content: center;
}
.wrap { width: 100%; max-width: 420px; padding: 20px 18px 40px; }

/* ===== LA PHOTO: blassa dyal tsswira ===== */
.photo {
  width: 150px; aspect-ratio: 1 / 1; border-radius: 50%; margin: 0 auto;
  border: 1.5px dashed var(--silver); background: var(--card);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; color: var(--muted); font: 15px system-ui, sans-serif;
  overflow: hidden; cursor: pointer; text-align: center;
}
.photo img { width: 100%; height: 100%; object-fit: cover; }
.photo input { display: none; }

/* ===== LOGO + NOM ===== */
.head { text-align: center; margin-top: 18px; position: relative; }
.logo {
  width: 60px; height: 60px; border-radius: 50%; margin: 0 auto;
  background: linear-gradient(145deg, #2a2d33, #0f1114);
  border: 3px solid var(--bg);
  display: flex; align-items: center; justify-content: center;
}
.logo svg { width: 34px; height: 34px; }
h1 { font-size: 34px; font-weight: 600; margin: 16px 0 24px; letter-spacing: .5px; }
.sub { font: 14px system-ui, sans-serif; color: var(--muted); margin: 0 0 22px; }

/* ===== LES LIENS ===== */
.links { display: grid; gap: 12px; }
.link {
  display: flex; align-items: center; gap: 14px; padding: 15px 18px;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  color: var(--text); text-decoration: none; font: 600 16px system-ui, sans-serif;
}
.link:focus-visible { outline: 2px solid var(--silver-dark); outline-offset: 2px; }
.link:active { background: var(--line); }
.ico { width: 22px; height: 22px; fill: none; stroke: var(--silver-dark); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.link span small { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }
/* ===== ANIMATION ===== */
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
.photo { animation: pop .7s cubic-bezier(.2,.8,.2,1) both; transition: border-color .25s, transform .25s; }
.photo:active { transform: scale(.97); }
h1 { animation: rise .6s ease .2s both; }
.link { animation: rise .6s ease both; transition: transform .2s, background .2s, border-color .2s; }
.link:nth-child(1) { animation-delay: .35s; }
.link:nth-child(2) { animation-delay: .45s; }
.link:nth-child(3) { animation-delay: .55s; }
.link:nth-child(4) { animation-delay: .65s; }
@media (hover: hover) { .link:hover { transform: translateY(-2px); border-color: var(--silver); } }
.link:active { transform: scale(.98); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="wrap">

  <!-- PHOTO: tap bach tzid tsswira -->
  <label class="photo" id="photo">
   <img alt="Photo" src="./logo.jpeg">
  </label>

  <!-- LOGO + NOM -->
  <div class="head">
    <h1>Bijouterie Soufiane</h1>
  </div>

  <!-- LIENS: بدل l'URL hna -->
  <nav class="links">
    <a class="link" href="tel:0638709701">
      <svg class="ico" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>
      <span>Appeler<small>0638709701</small></span>
    </a>
    <a class="link" href="https://www.instagram.com/bijouterie_soufiane1" target="_blank" rel="noopener">
      <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".6"/></svg>
      <span>Instagram<small>@bijouterie_soufiane1</small></span>
    </a>
    <a class="link" href="https://www.tiktok.com/@sof_silvr" target="_blank" rel="noopener">
      <svg class="ico" viewBox="0 0 24 24"><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5M14 3c.3 2.4 1.9 4 4.5 4.2"/></svg>
      <span>TikTok<small>@sof_silvr</small></span>
    </a>
    <a class="link" href="https://maps.app.goo.gl/5cYCHRxH9rJUxYRF6" target="_blank" rel="noopener">
      <svg class="ico" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5a7 7 0 0 0-14 0C5 14.800 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      <span>Localisation<small>Google Maps</small></span>
    </a>
  </nav>
</main>

<script>
document.getElementById('file').addEventListener('change', function (e) {
  var f = e.target.files && e.target.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function () {
    document.getElementById('photo').innerHTML = '<img alt="Photo" src="' + r.result + '">';
  };
  r.readAsDataURL(f);
});
</script>
</body>
</html>
